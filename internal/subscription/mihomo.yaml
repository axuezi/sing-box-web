# Generated by sing-box-web. Refresh the subscription to update.
# AI services use the AI group (picks the fastest working node by itself);
# other overseas traffic uses PROXY, chosen by hand.
mixed-port: 7897
allow-lan: false
mode: rule
log-level: info
ipv6: false

find-process-mode: strict
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

# GitHub is often unreachable from mainland China; fetch rule data from a CDN.
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    TLS: { ports: [443] }
    QUIC: { ports: [443] }
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

proxies:
{{proxies}}

proxy-groups:
  # REJECT keeps the group valid without proxies, and AI traffic off the
  # direct route when no proxy answers.
  - name: AI
    type: url-test
    proxies: [{{proxy_names}}REJECT]
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: PROXY
    type: select
    proxies: [{{proxy_names}}DIRECT]

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
  direct-nameserver: ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
  direct-nameserver-follow-policy: false
  # AI domains are resolved abroad, through the AI group.
  nameserver-policy:
    "geosite:category-ai-!cn": ["https://1.1.1.1/dns-query#AI", "https://8.8.8.8/dns-query#AI"]
    "+.openai.com,+.chatgpt.com,+.oaistatic.com,+.oaiusercontent.com": ["https://1.1.1.1/dns-query#AI"]
    "+.anthropic.com,+.claude.ai,+.claude.com,+.claudeusercontent.com": ["https://1.1.1.1/dns-query#AI"]
    "+.x.ai,+.grok.com": ["https://1.1.1.1/dns-query#AI"]
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "localhost"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.stun.*.*"
    - "+.stun.*.*.*"

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack: ["any:53", "tcp://any:53"]
  mtu: 1500

rules:
  - DST-PORT,22,DIRECT

  # LAN: router, NAS, printers
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT

  - PROCESS-NAME,WeChat,DIRECT
  - PROCESS-NAME,WeChat.exe,DIRECT
  - PROCESS-NAME,WeChatAppEx Helper,DIRECT

  - GEOSITE,category-ads-all,REJECT

  # ChatGPT / OpenAI
  - DOMAIN-SUFFIX,chatgpt.com,AI
  - DOMAIN-SUFFIX,openai.com,AI
  - DOMAIN-SUFFIX,oaistatic.com,AI
  - DOMAIN-SUFFIX,oaiusercontent.com,AI
  # Claude / Anthropic
  - DOMAIN-SUFFIX,claude.ai,AI
  - DOMAIN-SUFFIX,claude.com,AI
  - DOMAIN-SUFFIX,anthropic.com,AI
  - DOMAIN-SUFFIX,claudeusercontent.com,AI
  # xAI / Grok
  - DOMAIN-SUFFIX,x.ai,AI
  - DOMAIN-SUFFIX,grok.com,AI
  - GEOSITE,category-ai-!cn,AI

  # Apple's mainland CDN (iCloud, App Store, updates)
  - GEOSITE,apple-cn,DIRECT

  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve

  - MATCH,PROXY
